<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f5f7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#181a1e" />
    <meta
      name="description"
      content="本地优先的信号与系统、数字电子技术和模拟电子技术个人学习站点，按教材章节学习、检验并在自由电路工作台中验证。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:title" content="电路自习室｜本学期电子类课程个人学习站点" />
    <meta
      property="og:description"
      content="按教材章节学习信号与系统、数字电子技术和模拟电子技术，并在自由电路工作台中验证。"
    />
    <meta
      property="og:image"
      content="https://w1661884010-jpg.github.io/personal-workbench/og.png"
    />
    <link rel="icon" href="%BASE_URL%favicon.svg" />
    <title>电路自习室｜本学期电子类课程个人学习站点</title>
    <script>
      (() => {
        let preference = "system";
        try {
          const stored = localStorage.getItem("personal-workbench-theme");
          if (stored === "system" || stored === "dark" || stored === "light") preference = stored;
        } catch {}
        const systemPrefersDark = matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = preference === "system" ? (systemPrefersDark ? "dark" : "light") : preference;
        document.documentElement.dataset.themePreference = preference;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
